spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: news-verification-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/news_verification?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:news_verification_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:2h}
    redis:
      namespace: ${REDIS_SESSION_NAMESPACE:news-verification:session}
      repository-type: indexed
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: NEWS_VERIFICATION_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:local}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.security: INFO
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:news-verification}
    analysis-cache-ttl: ${REDIS_CACHE_TTL:3d}
